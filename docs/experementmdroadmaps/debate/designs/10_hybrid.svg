<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="640" fill="#0f1117"/>
  <rect x="0" y="0" width="1000" height="48" fill="#1a1d27"/>
  <rect x="0" y="48" width="1000" height="2" fill="#2a2f3a"/>
  <text x="20" y="29" font-family="Segoe UI, sans-serif" font-size="16" fill="#e5e7eb" font-weight="bold">Hybrid Debate Experience</text>

  <!-- disclosure switch -->
  <rect x="20" y="60" width="120" height="30" rx="6" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="40" y="80" font-family="Segoe UI, sans-serif" font-size="12" fill="#9ca3af">Simple</text>
  <rect x="150" y="60" width="120" height="30" rx="6" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="165" y="80" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">Detailed</text>
  <rect x="280" y="60" width="120" height="30" rx="6" fill="#6366f1"/>
  <text x="298" y="80" font-family="Segoe UI, sans-serif" font-size="12" fill="#fff">Expert</text>

  <!-- tab bar -->
  <rect x="430" y="60" width="100" height="30" rx="6" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="455" y="80" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">Arena</text>
  <rect x="540" y="60" width="100" height="30" rx="6" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="560" y="80" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">Timeline</text>
  <rect x="650" y="60" width="100" height="30" rx="6" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="668" y="80" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">Control</text>
  <rect x="760" y="60" width="100" height="30" rx="6" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="778" y="80" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">Workspace</text>

  <!-- main active layer (Expert = control + arena) -->
  <rect x="20" y="105" width="620" height="515" rx="10" fill="#161922" stroke="#2a2f3a"/>
  <text x="40" y="130" font-family="Segoe UI, sans-serif" font-size="13" fill="#9ca3af">ARENA (Design A layer)</text>
  <rect x="40" y="140" width="270" height="180" rx="8" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="55" y="165" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">PRO · Advocate</text>
  <rect x="55" y="175" width="150" height="8" rx="4" fill="#6366f1"/>
  <text x="55" y="210" font-family="Segoe UI, sans-serif" font-size="11" fill="#9ca3af">"baseline set"</text>
  <rect x="330" y="140" width="270" height="180" rx="8" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="345" y="165" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">CON · Skeptic</text>
  <rect x="345" y="175" width="90" height="8" rx="4" fill="#ef4444"/>
  <text x="345" y="210" font-family="Segoe UI, sans-serif" font-size="11" fill="#9ca3af">"cost fails"</text>
  <rect x="40" y="335" width="560" height="40" rx="8" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="55" y="360" font-family="Segoe UI, sans-serif" font-size="12" fill="#34d399">streaming… LIVE · round 3</text>
  <rect x="40" y="385" width="560" height="60" rx="8" fill="#1a1d27" stroke="#e0a82e"/>
  <text x="55" y="412" font-family="Segoe UI, sans-serif" font-size="12" fill="#e0a82e">consensus 0.55 · agree 4 · conflict 2</text>

  <!-- context-sensitive right rail (Expert = control) -->
  <rect x="660" y="105" width="320" height="515" rx="10" fill="#161922" stroke="#2a2f3a"/>
  <text x="680" y="130" font-family="Segoe UI, sans-serif" font-size="13" fill="#e5e7eb" font-weight="bold">CONTROL (Design B)</text>
  <rect x="680" y="140" width="280" height="60" rx="8" fill="#0f1117" stroke="#2a2f3a"/>
  <text x="695" y="162" font-family="Segoe UI, sans-serif" font-size="11" fill="#9ca3af">inject moderator note…</text>
  <rect x="680" y="210" width="130" height="28" rx="6" fill="#6366f1"/>
  <text x="706" y="229" font-family="Segoe UI, sans-serif" font-size="12" fill="#fff">Inject</text>
  <rect x="820" y="210" width="140" height="28" rx="6" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="832" y="229" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">Override next</text>
  <text x="680" y="270" font-family="Segoe UI, sans-serif" font-size="13" fill="#e5e7eb" font-weight="bold">TIMELINE (C)</text>
  <line x1="690" y1="285" x2="970" y2="285" stroke="#2a2f3a"/>
  <rect x="700" y="295" width="120" height="26" rx="6" fill="#1a1d27" stroke="#6366f1"/>
  <text x="712" y="312" font-family="Segoe UI, sans-serif" font-size="11" fill="#6366f1">step: weigh</text>
  <rect x="700" y="330" width="120" height="26" rx="6" fill="#161922" stroke="#34d399"/>
  <text x="712" y="347" font-family="Segoe UI, sans-serif" font-size="11" fill="#34d399">arg: cost</text>
  <text x="680" y="390" font-family="Segoe UI, sans-serif" font-size="13" fill="#e5e7eb" font-weight="bold">WORKSPACE (D)</text>
  <rect x="680" y="400" width="280" height="40" rx="8" fill="#1a1d27" stroke="#e0a82e"/>
  <text x="695" y="425" font-family="Segoe UI, sans-serif" font-size="11" fill="#e0a82e">→ Save as Crystal / Forum</text>
  <text x="680" y="470" font-family="Segoe UI, sans-serif" font-size="11" fill="#9ca3af">Rail adapts: empty in Simple,</text>
  <text x="680" y="486" font-family="Segoe UI, sans-serif" font-size="11" fill="#9ca3af">cognitive in Detailed, full in Expert.</text>
</svg>
