<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="640" fill="#0f1117"/>
  <rect x="0" y="0" width="1000" height="48" fill="#1a1d27"/>
  <rect x="0" y="48" width="1000" height="2" fill="#2a2f3a"/>
  <circle cx="20" cy="24" r="6" fill="#6366f1"/>
  <text x="36" y="29" font-family="Segoe UI, sans-serif" font-size="16" fill="#e5e7eb" font-weight="bold">Cognitive Timeline</text>
  <text x="900" y="29" font-family="Segoe UI, sans-serif" font-size="13" fill="#9ca3af">why · not just what</text>

  <!-- timeline axis -->
  <line x1="60" y1="320" x2="940" y2="320" stroke="#2a2f3a" stroke-width="2"/>

  <!-- cognitive lane (top) -->
  <text x="24" y="120" font-family="Segoe UI, sans-serif" font-size="12" fill="#6366f1">COGNITIVE STEPS</text>
  <rect x="100" y="150" width="150" height="50" rx="10" fill="#1a1d27" stroke="#6366f1"/>
  <text x="115" y="180" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">step: gather</text>
  <rect x="320" y="150" width="150" height="50" rx="10" fill="#1a1d27" stroke="#6366f1"/>
  <text x="335" y="180" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">step: weigh</text>
  <rect x="640" y="150" width="150" height="50" rx="10" fill="#1a1d27" stroke="#6366f1"/>
  <text x="655" y="180" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">step: counter</text>

  <!-- decision diamond (gold) -->
  <polygon points="830,175 855,150 880,175 855,200" fill="#e0a82e"/>
  <text x="900" y="180" font-family="Segoe UI, sans-serif" font-size="11" fill="#e0a82e">decision</text>

  <!-- debate lane (bottom) -->
  <text x="24" y="420" font-family="Segoe UI, sans-serif" font-size="12" fill="#34d399">ARGUMENTS</text>
  <rect x="110" y="380" width="160" height="60" rx="10" fill="#161922" stroke="#34d399"/>
  <text x="125" y="412" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">"baseline set"</text>
  <rect x="330" y="380" width="160" height="60" rx="10" fill="#161922" stroke="#34d399"/>
  <text x="345" y="412" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">"cost fails"</text>
  <rect x="650" y="380" width="160" height="60" rx="10" fill="#161922" stroke="#34d399"/>
  <text x="665" y="412" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">"amortized"</text>

  <!-- connectors -->
  <line x1="175" y1="200" x2="190" y2="380" stroke="#2a2f3a" stroke-dasharray="4"/>
  <line x1="395" y1="200" x2="410" y2="380" stroke="#2a2f3a" stroke-dasharray="4"/>
  <line x1="715" y1="200" x2="730" y2="380" stroke="#2a2f3a" stroke-dasharray="4"/>

  <!-- verdict anchor -->
  <rect x="855" y="380" width="120" height="60" rx="10" fill="#1a1d27" stroke="#e0a82e"/>
  <text x="870" y="412" font-family="Segoe UI, sans-serif" font-size="12" fill="#e0a82e">verdict</text>

  <!-- legend -->
  <rect x="20" y="540" width="960" height="80" rx="10" fill="#1a1d27" stroke="#2a2f3a"/>
  <rect x="40" y="565" width="16" height="16" rx="4" fill="#6366f1"/>
  <text x="64" y="578" font-family="Segoe UI, sans-serif" font-size="12" fill="#9ca3af">cognitive:step (why)</text>
  <rect x="280" y="565" width="16" height="16" rx="4" fill="#34d399"/>
  <text x="304" y="578" font-family="Segoe UI, sans-serif" font-size="12" fill="#9ca3af">debate:argument (what)</text>
  <polygon points="540,573 552,561 564,573 552,585" fill="#e0a82e"/>
  <text x="576" y="578" font-family="Segoe UI, sans-serif" font-size="12" fill="#9ca3af">cognitive:decision:made</text>
  <rect x="780" y="565" width="16" height="16" rx="4" fill="#e0a82e"/>
  <text x="804" y="578" font-family="Segoe UI, sans-serif" font-size="12" fill="#9ca3af">debate:verdict:generated</text>
</svg>
