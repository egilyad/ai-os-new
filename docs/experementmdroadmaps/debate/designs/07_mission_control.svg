  <rect x="40" y="128" width="180" height="8" rx="4" fill="#2a2f3a"/><rect x="40" y="128" width="150" height="8" rx="4" fill="#6366f1"/>
  <text x="40" y="155" font-family="Segoe UI, sans-serif" font-size="11" fill="#9ca3af">err 0 · to 0 · fb 0</text>

  <rect x="20" y="244" width="250" height="150" rx="10" fill="#161922" stroke="#2a2f3a"/>
  <circle cx="45" cy="270" r="6" fill="#e0a82e"/>
