  <circle cx="500" cy="220" r="80" fill="none" stroke="#2a2f3a" stroke-width="14"/>
  <path d="M500 220 L500 140 A80 80 0 0 1 565 255 Z" fill="none" stroke="#e0a82e" stroke-width="14"/>
  <text x="480" y="228" font-family="Segoe UI, sans-serif" font-size="22" fill="#e0a82e" font-weight="bold">0.55</text>
  <text x="370" y="340" font-family="Segoe UI, sans-serif" font-size="12" fill="#34d399">agree 4</text>
  <text x="560" y="340" font-family="Segoe UI, sans-serif" font-size="12" fill="#ef4444">conflict 2</text>

  <!-- right: inject / override + integration rail -->
  <rect x="730" y="84" width="250" height="200" rx="10" fill="#161922" stroke="#2a2f3a"/>
