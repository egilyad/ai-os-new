  <text x="758" y="140" font-family="Segoe UI, sans-serif" font-size="11" fill="#9ca3af">moderator statement…</text>
  <rect x="748" y="188" width="100" height="26" rx="6" fill="#6366f1"/>
  <text x="772" y="206" font-family="Segoe UI, sans-serif" font-size="12" fill="#fff">Inject</text>
  <rect x="858" y="188" width="104" height="26" rx="6" fill="#1a1d27" stroke="#2a2f3a"/>
  <text x="870" y="206" font-family="Segoe UI, sans-serif" font-size="12" fill="#e5e7eb">Override next</text>

  <rect x="730" y="300" width="250" height="94" rx="10" fill="#161922" stroke="#2a2f3a"/>
