  <rect x="40" y="288" width="180" height="8" rx="4" fill="#2a2f3a"/><rect x="40" y="288" width="80" height="8" rx="4" fill="#ef4444"/>
  <text x="40" y="315" font-family="Segoe UI, sans-serif" font-size="11" fill="#9ca3af">err 1 · to 0 · fb 0</text>

  <!-- center: consensus gauge + mini arena -->
  <rect x="290" y="84" width="420" height="310" rx="10" fill="#161922" stroke="#2a2f3a"/>
