  <text x="40" y="568" font-family="Segoe UI, sans-serif" font-size="13" fill="#9ca3af">QUALITY MONITOR (DebateQualityPanel)</text>
  <rect x="40" y="582" width="120" height="12" rx="6" fill="#2a2f3a"/><rect x="40" y="582" width="95" height="12" rx="6" fill="#34d399"/>
  <rect x="200" y="582" width="120" height="12" rx="6" fill="#2a2f3a"/><rect x="200" y="582" width="70" height="12" rx="6" fill="#6366f1"/>
  <rect x="360" y="582" width="120" height="12" rx="6" fill="#2a2f3a"/><rect x="360" y="582" width="50" height="12" rx="6" fill="#ef4444"/>
