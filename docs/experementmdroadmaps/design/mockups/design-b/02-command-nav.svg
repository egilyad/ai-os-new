<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="IBM Plex Sans, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#0a0c10"/>
  <rect x="0" y="0" width="1200" height="48" fill="#12151a" stroke="#222831"/>
  <rect x="48" y="10" width="420" height="28" rx="6" fill="#0a0c10" stroke="#222831"/><text x="62" y="29" fill="#7d8aa0" font-size="12">⌘K · type a command or search…</text>
  <rect x="0" y="48" width="56" height="712" fill="#12151a"/><rect x="0" y="48" width="3" height="40" fill="#06b6d4"/>
  <text x="80" y="84" fill="#e6edf3" font-size="18" font-weight="700">Command Bar &amp; Navigation</text>
  <text x="80" y="108" fill="#7d8aa0" font-size="12">Always-visible command bar supports commands, not just navigation (UX-008)</text>
  <rect x="80" y="130" width="1040" height="200" rx="6" fill="#12151a" stroke="#222831"/>
  <text x="100" y="160" fill="#06b6d4" font-size="12" font-weight="700">COMMAND PALETTE</text>
  <rect x="100" y="172" width="1000" height="34" rx="6" fill="#0a0c10" stroke="#06b6d4"/>
  <text x="116" y="194" fill="#e6edf3" font-size="13">&gt; Dispatch agent</text>
  <g font-size="12" fill="#e6edf3">
    <text x="100" y="240">⚡ New debate        start a debate operation</text>
    <text x="100" y="264">⚡ Dispatch agent     invoke an agent (chat/debate/plan)</text>
    <text x="100" y="288">⚡ New research      start research operation</text>
    <text x="100" y="312" fill="#7d8aa0">↑↓ navigate · ↵ run · esc close</text>
  </g>
  <rect x="80" y="350" width="500" height="340" rx="6" fill="#12151a" stroke="#222831"/>
  <text x="100" y="380" fill="#7d8aa0" font-size="11">OPERATIONS ZONES (rail)</text>
  <g font-size="13" fill="#e6edf3">
    <text x="100" y="412">◎ Overview</text>
    <text x="100" y="444">◎ Fleet (agents)</text>
    <text x="100" y="476">◎ Operations</text>
    <text x="100" y="508">◎ Intel (research/knowledge)</text>
    <text x="100" y="540">◎ Infra (system/settings)</text>
  </g>
  <text x="100" y="600" fill="#f59e0b" font-size="11">▸ Planned (30 tools)  ▸ Scheduler (preview)</text>
  <rect x="612" y="350" width="508" height="340" rx="6" fill="#12151a" stroke="#222831"/>
  <text x="632" y="380" fill="#7d8aa0" font-size="11">TOP BAR STATUS</text>
  <circle cx="648" cy="410" r="8" fill="#22c55e"/><text x="664" y="415" fill="#e6edf3" font-size="12">System healthy</text>
  <text x="632" y="450" fill="#f59e0b" font-size="12">⚠ 2 alerts</text>
  <rect x="632" y="464" width="460" height="60" rx="6" fill="#0a0c10" stroke="#f59e0b"/>
  <text x="648" y="488" fill="#f59e0b" font-size="11" font-weight="700">openrouter key 402 — add funds or rotate key</text>
  <text x="648" y="510" fill="#7d8aa0" font-size="11">Scheduler preview — not connected to SchedulerService</text>
  <text x="80" y="744" fill="#7d8aa0" font-size="11">Design B — Command Bar / Nav (mockup 02)</text>
</svg>
