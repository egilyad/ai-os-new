    <text x="284" y="352" fill="#e6e9ef">⚡ Ask System Architect — Guided plan</text>
  </g>
  <rect x="264" y="392" width="672" height="160" rx="8" fill="#14181f"/>
  <text x="284" y="420" fill="#34d399" font-size="11" font-weight="700">PREVIEW · DEBATE</text>
  <text x="284" y="448" fill="#e6e9ef" font-size="12">Topic: medical ethics</text>
  <text x="284" y="470" fill="#7c828c" font-size="11">Participants: System Architect (you choose more)</text>
