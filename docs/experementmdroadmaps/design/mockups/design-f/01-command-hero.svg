  <text x="20" y="26" fill="#7c828c" font-size="12">SuperAgents OS</text>
  <!-- command sheet -->
  <rect x="240" y="140" width="720" height="440" rx="14" fill="#0e1014" stroke="#1c2026" stroke-width="1.5" filter="url(#s)"/>
