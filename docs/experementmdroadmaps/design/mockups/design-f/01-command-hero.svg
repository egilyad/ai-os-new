  <text x="284" y="532" fill="#7c828c" font-size="11">Enter to launch · or pick another outcome above</text>
  <text x="240" y="620" fill="#7c828c" font-size="11">Design F — Command Palette hero (mockup 01) · commands + preview + arguments</text>
