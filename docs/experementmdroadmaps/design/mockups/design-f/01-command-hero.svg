  <text x="540" y="192" fill="#34d399" font-size="15">debate medical ethics</text>
  <text x="284" y="232" fill="#7c828c" font-size="11">↵ run · ↑↓ choose · esc cancel</text>
  <g font-size="13">
    <rect x="264" y="250" width="672" height="44" rx="8" fill="#14181f"/>
    <text x="284" y="277" fill="#e6e9ef">⚡ Ask System Architect — Chat with agent</text>
