  <text x="344" y="156" fill="#6366f1" font-size="12" font-weight="700">WHY THIS WORKS</text>
  <text x="344" y="188" fill="#e2e8f0" font-size="13">• 177 nav items → 5 workspaces (usability 02/08)</text>
  <text x="344" y="216" fill="#e2e8f0" font-size="13">• Stubs no longer impersonate real features (UX-001)</text>
  <text x="344" y="244" fill="#e2e8f0" font-size="13">• Duplicate "builder" removed — one canonical entry (UX-006)</text>
  <text x="344" y="272" fill="#e2e8f0" font-size="13">• "Planned" badge = amber, distinct from Live=green / Beta=blue</text>
  <text x="344" y="320" fill="#8b95a7" font-size="12">Badge vocabulary:</text>
  <rect x="344" y="336" width="80" height="24" rx="12" fill="#22c55e"/><text x="384" y="352" fill="#04210f" font-size="11" text-anchor="middle" font-weight="700">LIVE</text>
  <rect x="436" y="336" width="80" height="24" rx="12" fill="#3b82f6"/><text x="476" y="352" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">BETA</text>
  <rect x="528" y="336" width="90" height="24" rx="12" fill="#f59e0b"/><text x="573" y="352" fill="#3a2600" font-size="11" text-anchor="middle" font-weight="700">PLANNED</text>
  <text x="344" y="420" fill="#8b95a7" font-size="12">Responsive: rail → bottom tab bar on mobile; sub-nav → drawer.</text>
