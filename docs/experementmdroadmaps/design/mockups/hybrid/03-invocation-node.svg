<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#0f1117"/>
  <rect x="0" y="0" width="200" height="760" fill="#161922" stroke="#232733"/>
