<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#10131a"/>
  <!-- menu bar -->
  <rect x="0" y="0" width="1200" height="36" fill="#1a1f29"/>
  <text x="16" y="24" fill="#e8edf4" font-size="13" font-weight="700">SuperAgents OS</text>
  <rect x="900" y="6" width="240" height="24" rx="6" fill="#10131a" stroke="#2b3340"/><text x="912" y="22" fill="#8a94a6" font-size="11">⌘K · search or launch…</text>
  <circle cx="1180" cy="18" r="8" fill="#22c55e"/><text x="1160" y="22" fill="#8a94a6" font-size="10" text-anchor="end">online</text>
  <!-- desktop windows -->
  <rect x="60" y="60" width="520" height="380" rx="10" fill="#1a1f29" stroke="#2b3340"/>
  <rect x="60" y="60" width="520" height="30" rx="10" fill="#222a36"/><text x="76" y="80" fill="#e8edf4" font-size="12">Debate — Medical Ethics</text>
  <circle cx="540" cy="200" r="90" fill="none" stroke="#2b3340"/><circle cx="540" cy="140" r="22" fill="#1a1f29" stroke="#3b82f6"/><text x="540" y="145" fill="#e8edf4" font-size="11" text-anchor="middle" font-weight="700">SA</text><circle cx="470" cy="240" r="22" fill="#1a1f29" stroke="#22c55e"/><text x="470" y="245" fill="#e8edf4" font-size="11" text-anchor="middle" font-weight="700">SK</text><circle cx="610" cy="240" r="22" fill="#1a1f29" stroke="#f59e0b"/><text x="610" y="245" fill="#e8edf4" font-size="11" text-anchor="middle" font-weight="700">ME</text>
  <rect x="620" y="60" width="520" height="300" rx="10" fill="#1a1f29" stroke="#2b3340"/>
  <rect x="620" y="60" width="520" height="30" rx="10" fill="#222a36"/><text x="636" y="80" fill="#e8edf4" font-size="12">Chat — System Architect</text>
  <g font-size="11" fill="#8a94a6"><text x="640" y="120">You: plan a debate on ethics</text><text x="640" y="144" fill="#e8edf4">SA: propose 3 framings…</text></g>
  <!-- get started widget -->
  <rect x="620" y="380" width="520" height="180" rx="10" fill="#1a1f29" stroke="#3b82f6"/>
  <text x="640" y="412" fill="#3b82f6" font-size="13" font-weight="700">Get started</text>
  <text x="640" y="438" fill="#8a94a6" font-size="11">Welcome — take a 2-minute tour or open an app.</text>
  <rect x="640" y="456" width="140" height="30" rx="6" fill="#3b82f6"/><text x="710" y="475" fill="#fff" font-size="12" text-anchor="middle">Take tour</text>
  <rect x="792" y="456" width="140" height="30" rx="6" fill="#222a36"/><text x="862" y="475" fill="#e8edf4" font-size="12" text-anchor="middle">Open Launchpad</text>
  <!-- dock -->
  <rect x="0" y="700" width="1200" height="60" fill="#1a1f29" stroke="#2b3340"/>
  <g>
    <rect x="460" y="708" width="44" height="44" rx="10" fill="#3b82f6"/><text x="482" y="735" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">C</text>
    <rect x="516" y="708" width="44" height="44" rx="10" fill="#222a36"/><text x="538" y="735" fill="#e8edf4" font-size="14" text-anchor="middle" font-weight="700">D</text>
    <rect x="572" y="708" width="44" height="44" rx="10" fill="#222a36"/><text x="594" y="735" fill="#e8edf4" font-size="14" text-anchor="middle" font-weight="700">A</text>
    <rect x="628" y="708" width="44" height="44" rx="10" fill="#222a36"/><text x="650" y="735" fill="#e8edf4" font-size="14" text-anchor="middle" font-weight="700">R</text>
    <rect x="684" y="708" width="44" height="44" rx="10" fill="#222a36"/><text x="706" y="735" fill="#e8edf4" font-size="14" text-anchor="middle" font-weight="700">F</text>
  </g>
  <text x="60" y="744" fill="#8a94a6" font-size="11">Design D — Desktop (mockup 01) · windows persist; dock for core apps; ⌘K launcher</text>
</svg>
