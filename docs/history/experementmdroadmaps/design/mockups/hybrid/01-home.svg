<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#0f1117"/>
  <!-- slim grouped rail -->
  <rect x="0" y="0" width="200" height="760" fill="#161922" stroke="#232733"/>
  <text x="20" y="34" fill="#e6e9ef" font-size="14" font-weight="700">SuperAgents OS</text>
  <g font-size="12" fill="#9aa3b2">
    <text x="20" y="74" fill="#6366f1" font-weight="700">HOME</text>
    <text x="20" y="104">Knowledge</text><text x="20" y="126">Agents</text><text x="20" y="148">Debates</text>
    <text x="20" y="184" fill="#6366f1" font-weight="700">WORK</text>
    <text x="20" y="214">Rooms</text><text x="20" y="236">Research</text><text x="20" y="258">Forum</text>
    <text x="20" y="294" fill="#6366f1" font-weight="700">BUILD</text>
    <text x="20" y="324">Builder</text><text x="20" y="346">Director</text><text x="20" y="368">Scheduler</text>
    <text x="20" y="404" fill="#6366f1" font-weight="700">LIBRARY</text>
    <text x="20" y="434">Crystals</text><text x="20" y="456">Lenses</text><text x="20" y="478">Junctions</text>
  </g>
  <text x="20" y="700" fill="#7c828c" font-size="10">⌘K command · ⌘J live</text>
  <!-- header system monitor -->
  <rect x="200" y="0" width="1000" height="44" fill="#161922" stroke="#232733"/>
  <text x="220" y="28" fill="#9aa3b2" font-size="12">System Monitor</text>
  <circle cx="380" cy="22" r="6" fill="#34d399"/><text x="392" y="26" fill="#9aa3b2" font-size="11">3 debates live</text>
  <circle cx="540" cy="22" r="6" fill="#34d399"/><text x="552" y="26" fill="#9aa3b2" font-size="11">12 agents</text>
  <circle cx="690" cy="22" r="6" fill="#fbbf24"/><text x="702" y="26" fill="#9aa3b2" font-size="11">2 planned</text>
  <rect x="900" y="10" width="180" height="26" rx="13" fill="#0f1117" stroke="#232733"/>
  <text x="916" y="27" fill="#7c828c" font-size="11">⌘K · ask or command…</text>
  <!-- question-centric home -->
  <text x="240" y="120" fill="#e6e9ef" font-family="Source Serif, Georgia, serif" font-style="italic" font-size="22">What do you want to know?</text>
  <rect x="240" y="140" width="700" height="56" rx="10" fill="#161922" stroke="#6366f1" stroke-width="1.5"/>
  <text x="260" y="175" fill="#e6e9ef" font-size="15">best antibiotic for uncomplicated UTI?</text>
  <text x="240" y="230" fill="#7c828c" font-size="12">or press ⌘K — "debate…", "ask Architect…", "research…", "open Forum"</text>
  <!-- quick launch tiles -->
  <g font-size="12">
    <rect x="240" y="260" width="210" height="90" rx="10" fill="#161922" stroke="#232733"/>
    <text x="260" y="294" fill="#a78bfa">⚡ Run a debate</text><text x="260" y="318" fill="#7c828c">topic + agents</text>
    <rect x="470" y="260" width="210" height="90" rx="10" fill="#161922" stroke="#232733"/>
    <text x="490" y="294" fill="#34d399">⚡ Ask an agent</text><text x="490" y="318" fill="#7c828c">chat / plan</text>
    <rect x="700" y="260" width="210" height="90" rx="10" fill="#161922" stroke="#232733"/>
    <text x="720" y="294" fill="#e0a82e">⚡ Conclusions</text><text x="720" y="318" fill="#7c828c">past answers</text>
    <rect x="930" y="260" width="180" height="90" rx="10" fill="#161922" stroke="#232733"/>
    <text x="950" y="294" fill="#9aa3b2">▦ Launchpad</text><text x="950" y="318" fill="#7c828c">all features</text>
  </g>
  <!-- recent conclusions strip -->
  <text x="240" y="400" fill="#e0a82e" font-size="12" font-weight="700">RECENT CONCLUSIONS</text>
  <rect x="240" y="416" width="870" height="60" rx="8" fill="#161922" stroke="#232733"/>
  <text x="260" y="450" fill="#e6e9ef" font-size="12">Nitrofurantoin first-line for UTI — confidence 0.82 · src: research #r3, 4 debates</text>
  <rect x="240" y="700" width="870" height="40" rx="8" fill="#161922" stroke="#232733"/>
  <text x="260" y="725" fill="#7c828c" font-size="11">First time here? Press ⌘K and type "tour" — 60-second onboarding (UX-003).</text>
  <text x="240" y="744" fill="#7c828c" font-size="11">Hybrid — Home (mockup 01) · question-centric + command + monitor + launchpad</text>
</svg>
