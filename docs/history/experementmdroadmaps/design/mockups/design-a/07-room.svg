<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#0f1117"/>
  <rect x="0" y="0" width="64" height="760" fill="#12151c"/><circle cx="32" cy="32" r="14" fill="#6366f1"/><text x="32" y="37" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">S</text>
  <text x="320" y="56" fill="#e2e8f0" font-size="20" font-weight="700">Invoke an agent</text>
  <text x="320" y="80" fill="#8b95a7" font-size="12">Plain outcomes replace abstract "Where / Mode" (UX-005)</text>
  <rect x="320" y="110" width="850" height="240" rx="8" fill="#171a21" stroke="#262b36"/>
  <text x="344" y="140" fill="#6366f1" font-size="12" font-weight="700">1 · CHOOSE AGENT</text>
  <rect x="344" y="154" width="380" height="34" rx="6" fill="#0f1117" stroke="#3a4250"/><text x="356" y="175" fill="#8b95a7" font-size="12">System Architect ▾</text>
  <text x="744" y="140" fill="#6366f1" font-size="12" font-weight="700">2 · WHAT SHOULD IT DO?</text>
  <rect x="744" y="154" width="200" height="34" rx="6" fill="#6366f1"/><text x="844" y="175" fill="#fff" font-size="12" text-anchor="middle">💬 Chat with agent</text>
  <rect x="744" y="196" width="200" height="34" rx="6" fill="#1f2733" stroke="#3a4250"/><text x="844" y="217" fill="#e2e8f0" font-size="12" text-anchor="middle">⚔️ Run a debate</text>
  <rect x="744" y="238" width="200" height="34" rx="6" fill="#1f2733" stroke="#3a4250"/><text x="844" y="259" fill="#e2e8f0" font-size="12" text-anchor="middle">🎬 Guided plan</text>
  <text x="344" y="232" fill="#8b95a7" font-size="12">3 · TASK</text>
  <rect x="344" y="246" width="372" height="34" rx="6" fill="#0f1117" stroke="#3a4250"/>
  <text x="344" y="306" fill="#8b95a7" font-size="11">Outcome preview: "System Architect will reply in a chat thread."</text>
  <rect x="320" y="370" width="850" height="60" rx="8" fill="#1f2733" stroke="#f59e0b"/>
  <text x="344" y="396" fill="#f59e0b" font-size="12" font-weight="700">⚠ NO POLICY ALLOWS THIS</text>
  <text x="344" y="416" fill="#e2e8f0" font-size="11">No policy permits invoking System Architect in "debate" mode.</text>
  <rect x="940" y="396" width="200" height="28" rx="6" fill="#6366f1"/><text x="1040" y="414" fill="#fff" font-size="11" text-anchor="middle">Open Settings ▸ Policies</text>
  <text x="344" y="424" fill="#8b95a7" font-size="10">Actionable error replaces raw "no matching enabled policy" (UX-004).</text>
  <!-- scoped feed -->
  <rect x="320" y="450" width="850" height="240" rx="8" fill="#171a21" stroke="#262b36"/>
  <text x="344" y="480" fill="#6366f1" font-size="12" font-weight="700">LIVE · THIS INVOCATION (scoped, not global — UX-012)</text>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#8b95a7">
    <text x="344" y="512">12:04  invocation:requested   System Architect</text>
    <text x="344" y="534" fill="#22c55e">12:04  invocation:accepted    policy=manual-room-chat</text>
    <text x="344" y="556" fill="#f59e0b">12:05  invocation:rejected    mode=debate (no policy)</text>
  </g>
  <text x="320" y="720" fill="#8b95a7" font-size="11">Design A — Invoke / Room (mockup 07)</text>
</svg>
