<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#16140f"/>
  <rect x="0" y="0" width="64" height="760" fill="#1f1c16"/><circle cx="32" cy="32" r="14" fill="#e0a82e"/>
  <text x="96" y="56" fill="#f3ede0" font-size="20" font-weight="700">Conclusions</text>
  <text x="96" y="80" fill="#a89e8a" font-size="12">Every question that reached a result, ranked by confidence</text>
  <g font-size="13">
    <rect x="96" y="100" width="1008" height="120" rx="8" fill="#1f1c16" stroke="#3a342a"/>
    <text x="116" y="132" fill="#f3ede0" font-size="14" font-weight="700">"Best antibiotic for uncomplicated UTI?"</text>
    <text x="116" y="160" fill="#f3ede0" font-size="12">Nitrofurantoin first-line; resistance rising for trimethoprim.</text>
    <rect x="116" y="176" width="120" height="20" rx="6" fill="#5fbf6b"/><text x="176" y="190" fill="#0c1f10" font-size="10" text-anchor="middle">confidence 0.82</text>
    <text x="1000" y="176" fill="#a89e8a" font-size="10">src: research #r3 · 4 debates</text>

    <rect x="96" y="232" width="1008" height="120" rx="8" fill="#1f1c16" stroke="#3a342a"/>
    <text x="116" y="264" fill="#f3ede0" font-size="14" font-weight="700">"Structured vs free-form debate?"</text>
    <text x="116" y="292" fill="#f3ede0" font-size="12">3-agent panel + synthesizer beats free-form on balance.</text>
    <rect x="116" y="308" width="120" height="20" rx="6" fill="#e0a82e"/><text x="176" y="322" fill="#16140f" font-size="10" text-anchor="middle">confidence 0.67</text>
    <text x="1000" y="308" fill="#a89e8a" font-size="10">src: debate #d2 · agent SA</text>

    <rect x="96" y="364" width="1008" height="120" rx="8" fill="#1f1c16" stroke="#3a342a"/>
    <text x="116" y="396" fill="#f3ede0" font-size="14" font-weight="700">"How to reduce debate turn-loss?"</text>
    <text x="116" y="424" fill="#f3ede0" font-size="12">Widen governor timeout margin; classify SSE idle as retryable.</text>
    <rect x="116" y="440" width="120" height="20" rx="6" fill="#5fbf6b"/><text x="176" y="454" fill="#0c1f10" font-size="10" text-anchor="middle">confidence 0.79</text>
    <text x="1000" y="440" fill="#a89e8a" font-size="10">src: research #r1 · crystal #c9</text>
  </g>
  <text x="96" y="520" fill="#a89e8a" font-size="12">Click any conclusion → full provenance chain (question → debate/agent → conclusion).</text>
  <text x="96" y="744" fill="#a89e8a" font-size="11">Design E — Conclusions (mockup 07) · knowledge as accumulated answers</text>
</svg>
