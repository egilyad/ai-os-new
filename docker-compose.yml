# ─── SuperAgents OS — Docker Compose ───────────────────────────
# Two profiles:
#   dev   (default): HTTP on host :80, source files mounted in for
#                    live-reload dev work (see comments below).
#   prod             : HTTPS on host :443, TLS certs mounted as RO
#                    volumes, optimized production build.
#
# Usage:
#   docker compose --profile dev up --build
#   docker compose --profile prod up --build -d
# ────────────────────────────────────────────────────────────────

networks:
    app-net:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.0.0/16

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                NGINX_CONFIG: ${NGINX_CONFIG:-nginx.conf}
                VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
                VITE_SANDBOX_ENABLED: ${VITE_SANDBOX_ENABLED:-}
                VITE_PROXY_GEMINI: ${VITE_PROXY_GEMINI:-}
                VITE_PROXY_OPENROUTER: ${VITE_PROXY_OPENROUTER:-}
                VITE_PROXY_NVIDIA: ${VITE_PROXY_NVIDIA:-}
                VITE_PROXY_GROQ: ${VITE_PROXY_GROQ:-}
                VITE_PROXY_CEREBRAS: ${VITE_PROXY_CEREBRAS:-}
                VITE_PROXY_CLOUDFLARE: ${VITE_PROXY_CLOUDFLARE:-}
                VITE_PROXY_OPENAI: ${VITE_PROXY_OPENAI:-}
                VITE_DISABLE_TELEMETRY: ${VITE_DISABLE_TELEMETRY:-}
                VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-}
        image: superagents-os:${TAG:-latest}
        container_name: superagents-os
        labels:
            org.opencontainers.image.title: 'SuperAgents OS'
            org.opencontainers.image.version: '${TAG:-latest}'
            org.opencontainers.image.description: 'Autonomous multi-agent runtime with cognitive DAG topology'
            org.opencontainers.image.source: 'https://github.com/anomalyco/ai-os-new'
            org.opencontainers.image.licenses: 'MIT'
        restart: unless-stopped
        environment:
            # Override the API proxy target (default: OpenRouter).
            API_UPSTREAM: ${API_UPSTREAM:-https://api.openrouter.ai}
        profiles: [dev, prod]
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s
        # M5 (3c): security hardening — no-new-privileges, drop all capabilities, logging
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            - /tmp
            - /var/run
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: '1.0'

    # ── Dev profile: HTTP on :80 (localhost only) ────────────────
    # H-15: Bind to 127.0.0.1 to prevent remote MITM over plain HTTP.
    # For remote access, use --profile prod with TLS certs.
    app-dev:
        extends:
            service: app
        container_name: superagents-os-dev
        profiles: [dev]
        networks:
            - app-net
        ports:
            - '127.0.0.1:80:8080'

    # ── Prod profile: HTTPS on :443, HTTP redirects to it ────────
    app-prod:
        extends:
            service: app
        container_name: superagents-os-prod
        profiles: [prod]
        networks:
            - app-net
        # BLD-C5: prod profile must bake the SSL nginx template, otherwise
        build:
            args:
                NGINX_CONFIG: ${NGINX_CONFIG:-nginx-ssl.conf}
        ports:
            - '80:8080' # HTTPS→HTTP redirect
            - '443:8443' # The actual TLS listener (see nginx-ssl.conf)
        volumes:
            # Mount your real certs (or certbot output) here.
            # Create dir first: mkdir -p certs
            # Generate a self-signed cert for testing:
            #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            #     -keyout certs/key.pem -out certs/cert.pem \
            #     -subj "/CN=localhost"
            # Entrypoint checks for /etc/nginx/ssl/cert.pem and key.pem.
            - ./certs:/etc/nginx/ssl:ro
