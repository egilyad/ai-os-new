# ─── SuperAgents OS — Quickstart (M9.3) ────────────────────────
# Компания за <5 минут: UI + Company Gateway (heartbeat-loop включён).
#
# Usage:
#   1. SYNC_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
#   2. SYNC_SECRET=<secret> docker compose -f docker-compose.quickstart.yml up --build
#   3. UI:      http://localhost      (план/панели, company-in-browser)
#      Gateway: http://localhost:3001/api/health   (company-on-server)
#   4. node cli/superagents.mjs doctor --url http://localhost:3001
#
# SYNC_SECRET обязателен и НЕ имеет дефолта (fail fast, как в sync-server.mjs).
# SYNC_ORIGINS по умолчанию разрешает UI с http://localhost.
# Данные gateway лежат в ./data (gitignored) — бэкап: cli db-backup.
# ────────────────────────────────────────────────────────────────

networks:
    quick-net:
        driver: bridge

services:
    ui:
        build:
            context: .
            dockerfile: Dockerfile
        image: superagents-os:${TAG:-latest}
        container_name: superagents-quick-ui
        restart: unless-stopped
        networks:
            - quick-net
        ports:
            - '127.0.0.1:80:8080'
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 20s
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            - /tmp
            - /var/run
            # Writable rendered nginx config (see Dockerfile seed +
            # entrypoint restore; read_only rootfs shadows the template).
            - /etc/nginx/conf.d
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    gateway:
        image: node:22-alpine
        container_name: superagents-quick-gateway
        restart: unless-stopped
        # H-4: same hardening as ui (was root + uncapped). ./data stays
        # writable via the explicit rw bind below despite read_only rootfs.
        user: 'node'
        working_dir: /app
        # Код — read-only, состояние — read-write (./data).
        volumes:
            - .:/app:ro
            - ./data:/app/data:rw
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 1G
        command: ['node', 'server/sync-server.mjs']
        environment:
            SYNC_SECRET: ${SYNC_SECRET:?set SYNC_SECRET env var (see header)}
            # L-7: prefer a secret file over env (invisible to `docker inspect`):
            # SYNC_SECRET_FILE: /run/secrets/sync_secret
            # secrets:
            #     - sync_secret
            SYNC_PORT: '3001'
            SYNC_ORIGINS: ${SYNC_ORIGINS:-http://localhost}
            HEARTBEAT_LOOP: '1'
            HEARTBEAT_POLL_MS: ${HEARTBEAT_POLL_MS:-15000}
            # Phase 70: kill-switch browser-use адаптера (server/adapters.mjs).
            ADAPTERS_ALLOW_BROWSER_USE: ${ADAPTERS_ALLOW_BROWSER_USE:-0}
            # Loop gateway-режим (adapter computer-act → sidecar /act).
            # Docker-имя sidecar (браузер шлёт запросы без sidecarUrl — шлюз
            # подставляет это значение сам).
            ADAPTERS_ALLOW_COMPUTER_ACT: ${ADAPTERS_ALLOW_COMPUTER_ACT:-0}
            BROWSER_USE_ACT_URL: ${BROWSER_USE_ACT_URL:-http://browser-use-sidecar:3100/act}
        networks:
            - quick-net
        ports:
            - '127.0.0.1:3001:3001'
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - fetch('http://127.0.0.1:3001/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    # ── Phase 70: browser-use sidecar (OPT-IN via --profile browser) ──
    # Gateway-образ не умеет запускать Chromium (node:22-alpine + cap_drop
    # ALL + read_only), поэтому исполнение browser-задач живёт здесь:
    # playwright/python + FastAPI-мост (docker/browser-use-sidecar/server.py).
    # Start:  SYNC_SECRET=... ADAPTERS_ALLOW_BROWSER_USE=1 docker compose
    #           -f docker-compose.quickstart.yml --profile browser up --build
    # Health: curl http://localhost:3100/health
    # Без LLM-ключа sidecar работает в fallback-режиме (navigate+screenshot);
    # full-agent режим: BROWSER_USE_LLM_API_KEY (+ PROVIDER/MODEL).
    browser-use-sidecar:
        build:
            context: .
            dockerfile: docker/browser-use-sidecar/Dockerfile
        image: superagents-browser-use:${TAG:-latest}
        container_name: superagents-browser-use
        restart: unless-stopped
        profiles:
            - browser
        networks:
            - quick-net
        ports:
            - '127.0.0.1:3100:3100'
        environment:
            BROWSER_USE_ALLOWED_DOMAINS: ${BROWSER_USE_ALLOWED_DOMAINS:-}
            BROWSER_USE_LLM_API_KEY: ${BROWSER_USE_LLM_API_KEY:-}
            BROWSER_USE_LLM_PROVIDER: ${BROWSER_USE_LLM_PROVIDER:-openai}
            BROWSER_USE_LLM_MODEL: ${BROWSER_USE_LLM_MODEL:-gpt-4o-mini}
            BROWSER_USE_LLM_BASE_URL: ${BROWSER_USE_LLM_BASE_URL:-}
        healthcheck:
            test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3100/health')"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
