# P1.28: Automated dependency security/version updates.
# GitHub enable Dependabot to open PRs for npm dependency updates.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '08:00'
          timezone: Etc/UTC
      open-pull-requests-limit: 10
      # Suppress updates for major/breaking upgrades that require manual work.
      # 2026-10-04: react-router + zod ignores REMOVED — both verified clean
      # (7.18.2 / 4.4.3, OSV + npm audit) and security patches for them must
      # arrive as PRs. typescript stays ignored: the repo deliberately pins
      # TS ~6.0.2 (madge@8 wants ^5.4.4, see .npmrc) — majors need manual work.
      ignore:
          - dependency-name: typescript
      labels:
          - dependencies
          - security
      reviewers:
          - n95887174-source
      commit-message:
          prefix: chore(deps)
          prefix-development: chore(deps-dev)

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '08:00'
          timezone: Etc/UTC
      open-pull-requests-limit: 5
      labels:
          - ci
          - dependencies
