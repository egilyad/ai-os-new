name: CI

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    # Manual runs (Stage 4): Actions → CI → Run workflow → any branch.
    workflow_dispatch:

env:
    NODE_VERSION: '22'

jobs:
    quality:
        name: Type-check & Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # L-9: do not persist GITHUB_TOKEN in .git/config for later steps.
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps

            - name: TypeScript type-check
              # BLD-C3: root tsconfig.json is solution-style ("files": [] with
              # references). `tsc --noEmit` against it compiles zero files and
              # exits 0 — false green gate. `tsc -b --noEmit` walks references
              # and actually type-checks tsconfig.app.json + tsconfig.node.json.
              run: npx tsc -b --noEmit

            - name: ESLint
              # Stage 4: 0 errors. Warnings are React Compiler strictness
              # (set-state-in-effect/refs/purity) + no-restricted-imports +
              # react-refresh/only-export-components + fa-02 raw colors (~4.2k
              # across all panels). Threshold pinned at current count to keep
              # errors fatal while allowing warnings to trend down.
              # QW-2: lowered 5600 -> 4300 (2026-11-09, actual 4199).
              run: npm run lint -- --max-warnings 4300

            - name: Wiki docs in sync
              # docs/wiki is generated from the Wiki corpus
              # (src/components/WikiPanel) so GitHub renders the whole wiki
              # without the app. docs/manifest.json is the machine-readable
              # index derived from the same corpus + route registries. Fail if
              # either is stale relative to the source.
              run: |
                  npm run gen:wiki-libraries
                  npm run gen:wiki-docs
                  npm run gen:wiki-manifest
                  npm run gen:wiki-connections
                  npm run gen:wiki-docs-health
                  npm run gen:docs-inventory
                  npm run gen:wiki-docs-standard
                  npm run gen:wiki-docs-index
                  npm run gen:wiki-system-map
                  npm run gen:wiki-history
                  npm run gen:wiki-capabilities
                  npm run gen:docs-graph
                  npm run gen:wiki-checks
                  npm run gen:wiki-coverage
                  git diff --exit-code -- docs/wiki docs/inventory.json docs/graph.json docs/entity-model.json docs/manifest.json src/generated

            - name: Documentation health
              # Objective checks over the committed wiki mirror: declared source
              # paths must resolve, internal links must work, slugs must be
              # unique. Hard problems fail the job; soft metrics (incomplete
              # articles, unmapped panels) are printed for visibility.
              run: npm run docs:health

    build:
        name: Build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: quality
        permissions:
            # CI-M-3: least privilege — build uses no actions API.
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # L-9: do not persist GITHUB_TOKEN in .git/config for later steps.
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: build-npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.build-npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps

            - name: Build
              run: npm run build
              env:
                  VITE_APP_ORIGIN: https://example.com
                  VITE_BUILD_ID: ${{ github.sha }}
                  VITE_BASE_PATH: /ai-os-new/

            - name: Check bundle size
              run: |
                  TOTAL_SIZE=$(du -sb dist/ | cut -f1)
                  echo "Total dist size: $((TOTAL_SIZE / 1024 / 1024)) MB"
                  if [ "$TOTAL_SIZE" -gt $((30 * 1024 * 1024)) ]; then
                    echo "::warning title=Bundle Size::Total dist size exceeds 30 MB ($((TOTAL_SIZE / 1024 / 1024)) MB)"
                  fi
                  echo "Chunk sizes:"
                  ls -lh dist/assets/*.js 2>/dev/null | awk '{print $5, $NF}' | sort -rh | head -10

            - name: Upload build artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/
                  # CI-L-2: keep the exact shipped bundle for post-prod forensics.
                  retention-days: 30

    test:
        name: Unit Tests
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        needs: quality
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # L-9: do not persist GITHUB_TOKEN in .git/config for later steps.
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: test-npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.test-npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps

            - name: Run tests
              # Scoped to the verified stable set (same paths as test:coverage).
              # Full `vitest run` (363 files) OOMs/hangs shared runners and
              # carries 257 pre-existing failures in 67 files — tracked as
              # backlog, extended into this gate incrementally.
              env:
                  NODE_OPTIONS: --max-old-space-size=6144
              run: |
                  set -o pipefail
                  npm run test:stable 2>&1 | tee test-output.log

            - name: Run server tests (node:test, C-5/C-6)
              # Plain node, no workers: company-store atomicity + write-queue
              # recovery against a temp COMPANY_DATA_DIR. Fast (<5s).
              run: npm run test:server

            - name: Publish test tail on failure
              # Annotations are visible without login, unlike full logs.
              if: failure()
              run: node -e "const fs=require('fs');let t='';try{t=fs.readFileSync('test-output.log','utf8')}catch(e){console.log('no test-output log');process.exit(0)};const tail=t.split('\n').slice(-40).join('\n').slice(-4000).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');console.log('::notice title=test-tail::'+tail)"

    coverage:
        name: Test Coverage
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        needs: quality
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # L-9: do not persist GITHUB_TOKEN in .git/config for later steps.
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: cov-npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.cov-npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps

            - name: Run tests with coverage
              env:
                  NODE_OPTIONS: --max-old-space-size=10240
              # P1.9: coverage is scoped to the covered directories via
              # coverage.include in vitest.config.ts (stores, hooks,
              # kernel/events, kernel/workers, container). Thresholds: 30%
              # statements/lines/functions, 20% branches. Extend the include
              # list as P1.3-P1.7 add tests to kernel/services, memory,
              # key-management, llm. Note: `npm run test -- --coverage` would
              # run the whole suite (OOM on some files) — this runs only the
              # verified stable set.
              run: |
                  set -o pipefail
                  npm run test:coverage 2>&1 | tee coverage-output.log

            - name: Publish coverage tail
              # Annotations are visible without login, unlike full logs. Runs
              # always (not only on failure) so current coverage numbers are
              # inspectable for threshold calibration (QW-1).
              run: node -e "const fs=require('fs');let t='';try{t=fs.readFileSync('coverage-output.log','utf8')}catch(e){console.log('no coverage-output log');process.exit(0)};const i=t.indexOf('All files');const head=i>=0?t.slice(Math.max(0,i-250),i+500):t.split('\n').slice(0,12).join('\n');const tail=t.split('\n').slice(-30).join('\n');const out=(head+'\n---TAIL---\n'+tail).slice(-5000).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');console.log('::notice title=coverage-summary::'+out)"

    full-tests:
        # Полный прогон всех unit/компонентных тестов (не только test:stable).
        # Разбит на три группы, чтобы не OOM-ить раннер на одном процессе.
        name: Full Unit Tests (${{ matrix.group }})
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        needs: quality
        strategy:
            fail-fast: false
            matrix:
                group: [kernel-debate, kernel-svc-a, kernel-svc-r1, kernel-svc-r2, kernel-svc-a4, kernel-svc-a2, kernel-svc-a3, kernel-svc-b, kernel-rest, components, rest]
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'
            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: full-npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: Install dependencies
              if: steps.full-npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps
            - name: Run full tests (${{ matrix.group }})
              env:
                  NODE_OPTIONS: --max-old-space-size=8192
                  CI_FULL_TESTS: '1'
              run: |
                  set -o pipefail
                  case "${{ matrix.group }}" in
                    kernel-debate) TARGETS="src/kernel/services/debate-runtime" ;;
                    kernel-svc-a) TARGETS="src/kernel/services/advisor src/kernel/services/agent-diversity src/kernel/services/agent-runtime src/kernel/services/assistant src/kernel/services/auth src/kernel/services/browser src/kernel/services/builder" ;;
                    kernel-svc-r1) TARGETS="src/kernel/services/admin-service.test.ts src/kernel/services/agems-approval-service.test.ts src/kernel/services/agent-avatar-service.test.ts src/kernel/services/agent-config-revision-service.test.ts src/kernel/services/agent-health-monitor.test.ts src/kernel/services/agent-identity.test.ts src/kernel/services/agent-project-runtime.test.ts src/kernel/services/agent-service.test.ts src/kernel/services/approval-execution-bridge-service.test.ts src/kernel/services/approval-service.test.ts src/kernel/services/artifact-service.test.ts src/kernel/services/autonomy-orchestrator.test.ts src/kernel/services/autonomy-runner.test.ts src/kernel/services/bookmarks-demo-seed.test.ts src/kernel/services/browser-inspector-service.test.ts src/kernel/services/budget-alert-service.test.ts src/kernel/services/budget-service.test.ts src/kernel/services/cache-service.test.ts src/kernel/services/causal-timeline-service.test.ts src/kernel/services/channels-demo-seed.test.ts src/kernel/services/channel-service.test.ts src/kernel/services/chat-bookmarks-service.test.ts src/kernel/services/chat-demo-seed.test.ts src/kernel/services/chat-executor.test.ts src/kernel/services/ChatService.autoRouting.test.ts src/kernel/services/ChatService.test.ts src/kernel/services/cognitive-service.test.ts src/kernel/services/compromise-webhook-service.test.ts src/kernel/services/config-history.test.ts src/kernel/services/config-registry.test.ts src/kernel/services/config-service.test.ts src/kernel/services/connector-service.test.ts src/kernel/services/consistency-checker.test.ts src/kernel/services/conversation-context-propagation.test.ts src/kernel/services/conversation-director-service.runtime.test.ts src/kernel/services/conversation-director-service.test.ts src/kernel/services/conversation-execution-engine.test.ts src/kernel/services/conversation-hybrid-policy.test.ts src/kernel/services/conversation-orchestrator.test.ts src/kernel/services/conversation-orchestrator-events.test.ts src/kernel/services/conversation-scripted-policy.test.ts src/kernel/services/cross-tab-lock-service.test.ts src/kernel/services/dexie-schema-versioning.test.ts src/kernel/services/director-demo-seed.test.ts src/kernel/services/embedding-service.test.ts src/kernel/services/execution-governor.test.ts src/kernel/services/execution-queue.test.ts src/kernel/services/external-secrets-service.test.ts src/kernel/services/fact-check-service.test.ts src/kernel/services/file-toolset.test.ts src/kernel/services/group-manager.test.ts src/kernel/services/health-sla-service.test.ts" ;;
                    kernel-svc-r2) TARGETS="src/kernel/services/key-intelligence-pipeline.test.ts src/kernel/services/lifecycle-manager.test.ts src/kernel/services/llm-client-service.test.ts src/kernel/services/local-secret-store.test.ts src/kernel/services/mcp-service.local.test.ts src/kernel/services/memory-demo-seed.test.ts src/kernel/services/memory-engine.test.ts src/kernel/services/memory-orchestrator.test.ts src/kernel/services/metrics-service.test.ts src/kernel/services/monitoring-service.test.ts src/kernel/services/multi-agent-project-service.test.ts src/kernel/services/n8n-service.test.ts src/kernel/services/notification-webhook-service.test.ts src/kernel/services/orchestration-service.test.ts src/kernel/services/policy-service.test.ts src/kernel/services/pricing-service.test.ts src/kernel/services/probe-service.test.ts src/kernel/services/project-debate-integration.test.ts src/kernel/services/project-demo-seed.test.ts src/kernel/services/project-invocation-bridge.test.ts src/kernel/services/project-memory-service.test.ts src/kernel/services/project-observability-service.test.ts src/kernel/services/projects-e2e.integration.test.ts src/kernel/services/project-service.test.ts src/kernel/services/project-template-service.test.ts src/kernel/services/project-workspace-service.test.ts src/kernel/services/prompts-demo-seed.test.ts src/kernel/services/prompt-security-eval.test.ts src/kernel/services/prompt-security-service.test.ts src/kernel/services/provider-adapter-registry.test.ts src/kernel/services/provider-stack.e2e.test.ts src/kernel/services/python-runner-service.test.ts src/kernel/services/race-executor.test.ts src/kernel/services/reconnection-service.test.ts src/kernel/services/roadmap-eval.test.ts src/kernel/services/role-library.export.test.ts src/kernel/services/role-library.test.ts src/kernel/services/rooms-demo-seed.test.ts src/kernel/services/rotation-service.test.ts src/kernel/services/router-scoring.test.ts src/kernel/services/RouterService.latency.test.ts src/kernel/services/router-services.test.ts src/kernel/services/route-rules.test.ts src/kernel/services/sandbox-service.test.ts src/kernel/services/scheduler-demo-seed.test.ts src/kernel/services/scheduler-service.test.ts src/kernel/services/session-affinity-store.test.ts src/kernel/services/session-manager-service.test.ts src/kernel/services/session-memory-service.test.ts src/kernel/services/skill-service.test.ts src/kernel/services/snapshot-service.test.ts src/kernel/services/system-status-service.test.ts src/kernel/services/task-handoff.test.ts src/kernel/services/tasks-demo-seed.test.ts src/kernel/services/telegram-service.test.ts src/kernel/services/timeline-service.test.ts src/kernel/services/time-machine-service.test.ts src/kernel/services/tool-executor.test.ts src/kernel/services/trace-service.test.ts src/kernel/services/usage-tracker.test.ts src/kernel/services/virtual-key-service.test.ts src/kernel/services/website-preview-service.test.ts src/kernel/services/workflows-demo-seed.test.ts src/kernel/services/workflow-service.test.ts" ;;
                    kernel-svc-a4) TARGETS="src/kernel/services/capability src/kernel/services/capability-trust src/kernel/services/catalog src/kernel/services/cognitive-intelligence src/kernel/services/computer src/kernel/services/council src/kernel/services/crew src/kernel/services/crystal-vault" ;;
                    kernel-svc-a2) TARGETS="src/kernel/services/debateplus src/kernel/services/deploy src/kernel/services/dexie src/kernel/services/elo src/kernel/services/eval src/kernel/services/event-bridge src/kernel/services/event-sourcing src/kernel/services/forum src/kernel/services/frontier" ;;
                    kernel-svc-a3) TARGETS="src/kernel/services/graph src/kernel/services/interop src/kernel/services/invocation src/kernel/services/junction-engine src/kernel/services/key-management src/kernel/services/knowledge-generator src/kernel/services/lens-engine src/kernel/services/llm-bridge src/kernel/services/memory src/kernel/services/memory-center src/kernel/services/meta" ;;
                    kernel-svc-b) TARGETS="src/kernel/services/new src/kernel/services/ops src/kernel/services/parity src/kernel/services/permissions src/kernel/services/persona src/kernel/services/plugins src/kernel/services/projections src/kernel/services/provider-runtime src/kernel/services/rag src/kernel/services/research-adapters src/kernel/services/rivals src/kernel/services/rivals10 src/kernel/services/rivals11 src/kernel/services/rivals12 src/kernel/services/rivals13 src/kernel/services/rivals14 src/kernel/services/rivals15 src/kernel/services/rivals16 src/kernel/services/rivals17 src/kernel/services/rivals18 src/kernel/services/rivals19 src/kernel/services/rivals2 src/kernel/services/rivals20 src/kernel/services/rivals3 src/kernel/services/rivals4 src/kernel/services/rivals5 src/kernel/services/rivals6 src/kernel/services/rivals7 src/kernel/services/rivals9 src/kernel/services/routing-policy src/kernel/services/runtime-intelligence src/kernel/services/sandbox src/kernel/services/security src/kernel/services/simulation src/kernel/services/skills src/kernel/services/storage src/kernel/services/synthesis src/kernel/services/timeline src/kernel/services/tool-loop src/kernel/services/tool-pipeline src/kernel/services/tools src/kernel/services/trust src/kernel/services/viz src/kernel/services/wiki-brain" ;;
                    kernel-rest) TARGETS="src/kernel/dal src/kernel/events src/kernel/instances src/kernel/service-registration src/kernel/contracts src/kernel/types src/kernel/utils src/kernel/container.ts src/kernel/service-helper.ts" ;;
                    components) TARGETS="src/components" ;;
                    rest) TARGETS="src/llm src/stores src/hooks src/tests" ;;
                  esac
                  npx vitest run $TARGETS --pool=forks --no-coverage 2>&1 | tee full-${{ matrix.group }}-tests.log
            - name: Publish test tail on failure
              if: failure()
              run: node -e "const fs=require('fs');const f='full-${{ matrix.group }}-tests.log';let t='';try{t=fs.readFileSync(f,'utf8')}catch(e){console.log('no log');process.exit(0)};const tail=t.split('\n').slice(-80).join('\n').slice(-6000).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');console.log('::notice title=full-${{ matrix.group }}-tail::'+tail)"

    security-audit:
        name: Security Audit
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # L-9: do not persist GITHUB_TOKEN in .git/config for later steps.
                persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'
            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: audit-npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: Install dependencies
              if: steps.audit-npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps
            - name: Run npm audit
              # H-6 CLOSED 2026-10-04: tree verified clean (0 vulns) via
              # `npm audit fix` + OSV cross-check — including react-router
              # 7.18.2 (GHSA-qwww-vcr4-c8h2 does not affect it) and zod 4.4.3.
              # Gate restored to high: any new high/critical fails the build.
              run: npm audit --audit-level=high

    circular-check:
        name: Circular Dependency Check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: quality
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # L-9: do not persist GITHUB_TOKEN in .git/config for later steps.
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: circ-npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.circ-npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps

            - name: Check kernel circular deps
              run: npm run check:circular-kernel

    dep-graph:
        name: Dependency Graph Check
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: quality
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # L-9: do not persist GITHUB_TOKEN in .git/config for later steps.
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: dep-npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.dep-npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps

            - name: Check dependency graph rules
              # P1.10: dependency-cruiser enforces layer rules (UI -> Application
              # -> Kernel -> Infrastructure) and the composition-root exception.
              # 0 violations expected (1418 modules, 5074 deps cruised 2026-08-01).
              run: npm run check:deps

    e2e:
        name: E2E Tests (${{ matrix.name }})
        runs-on: ubuntu-24.04
        # 30 specs (basic 4 + data 4 + routes 22) with cold-boot gates.
        # Explicit file groups: the 4 double-boot data tests are the heavy
        # ones — routes-b-keys used to pair 2 of them with 11 route tests
        # (CI-H-1). Now all 4 heavies share one shard, route shards are
        # light-only. Each shard boots its own preview server.
        timeout-minutes: 40
        needs: [quality, build]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: basic-routes-a
                      spec: 'e2e/basic-flow.spec.ts e2e/routes-a-flow.spec.ts'
                    - name: routes-b
                      spec: 'e2e/routes-b-flow.spec.ts'
                    - name: health-chat-sync
                      spec: 'e2e/data-health.spec.ts e2e/data-chat.spec.ts e2e/data-keys.spec.ts e2e/data-sync.spec.ts e2e/data-room.spec.ts'
                    - name: debate
                      spec: 'e2e/data-debate.spec.ts'
                    - name: forum
                      spec: 'e2e/data-forum.spec.ts'
                    - name: projects
                      spec: 'e2e/data-projects.spec.ts'
                    - name: organizer
                      spec: 'e2e/data-organizer.spec.ts'
                    - name: dialogs
                      spec: 'e2e/data-dialogs.spec.ts'
                    - name: knowledge
                      spec: 'e2e/data-knowledge.spec.ts'
                    - name: research
                      spec: 'e2e/data-research.spec.ts'
                    - name: fleet
                      spec: 'e2e/data-fleet.spec.ts'
                    - name: runtime
                      spec: 'e2e/data-runtime.spec.ts'
        permissions:
            # CI-M-3: download-artifact within the same run needs no actions scope.
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # L-9: do not persist GITHUB_TOKEN in .git/config for later steps.
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: e2e-npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.e2e-npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              # CI-M-2: always reinstall (idempotent, ~10s on cache hit) —
              # a cache HIT used to skip OS-package install, so a runner-image
              # bump dropping a system lib surfaced as a test failure.
              run: npx playwright install --with-deps chromium

            - name: Download build artifact
              # Reuses dist/ from the build job instead of rebuilding: faster
              # and guarantees e2e runs against the exact shipped bundle.
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: dist/

            - name: Run E2E tests
              run: npm run test:e2e -- ${{ matrix.spec }}

            - name: Upload Playwright report on failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report-${{ matrix.name }}
                  path: test-results/
                  # CI-L-2: keep failure diagnostics past the weekly flake window.
                  retention-days: 14

            - name: Publish browser console to annotations on failure
              # Annotations are visible without login, unlike full logs.
              if: failure()
              run: node -e "const fs=require('fs');const path=require('path');const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);let files=[];try{files=walk('test-results').filter(f=>f.endsWith('error-context.md'))}catch(e){console.log('no test-results dir');process.exit(0)};files.sort((a,b)=>(a.includes('retry')?1:0)-(b.includes('retry')?1:0));for(const f of files.slice(0,4)){const raw=fs.readFileSync(f,'utf8');const t=raw.slice(-8000).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');console.log('::notice title=e2e-console-tail::'+f+'%0A'+t)}"

            - name: Publish page-state log
              if: failure()
              run: node -e "const fs=require('fs');let t='';try{t=fs.readFileSync('test-results/page-state.log','utf8')}catch(e){console.log('no page-state log');process.exit(0)};for(const line of t.split('\n').filter(Boolean).slice(0,8)){console.log('::notice title=e2e-page-state::'+line.slice(0,3000).replace(/%/g,'%25').replace(/\r/g,'%0D'))}"

            - name: Dump preview boot diagnostics on failure
              if: failure()
              run: node e2e/dump-console.mjs

    demos:
        name: Demo screenshots
        # Real panel captures via Playwright (Этап C). Not gated: PNG bytes
        # differ across runner images, so this only refreshes and uploads the
        # images for review — the committed ones are refreshed with `npm run gen:demos`.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        needs: [build]
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: demos-npm-cache
              with:
                  path: node_modules
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: steps.demos-npm-cache.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Download build artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: dist/

            - name: Capture demo screenshots
              run: npm run gen:demos

            - name: Upload demo screenshots
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: demo-screenshots
                  path: docs/demos/img/
                  retention-days: 14

    deploy:
        name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        needs: [quality, build, test, coverage, security-audit, circular-check, dep-graph, e2e]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            # CI-C-1: the sourcemaps upload script lives in the repo —
            # without checkout it would fail with ENOENT as soon as
            # SENTRY/DATADOG secrets are configured. (node itself is
            # preinstalled on the runner; no npm ci needed: the script
            # uses stdlib only.)
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # L-9: do not persist GITHUB_TOKEN in .git/config for later steps.
                persist-credentials: false
            - name: Download build artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: dist/

            - name: Upload sourcemaps to error tracking (Sentry/Datadog)
              # P1.27: `sourcemap: 'hidden'` produces maps but does not embed
              # sourceMappingURL, so dist is safe to ship. Upload maps from the
              # artifact to Sentry (or Datadog) for stacktrace de-minification.
              # The script no-ops cleanly when no credentials are configured, so
              # the deploy is not blocked for backends without error tracking.
              if: env.SENTRY_AUTH_TOKEN != '' || env.DATADOG_API_KEY != ''
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
                  SENTRY_RELEASE: ${{ github.sha }}
                  DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
                  DATADOG_SITE: ${{ secrets.DATADOG_SITE }}
                  DD_SERVICE: ${{ secrets.DD_SERVICE }}
              run: npm run sourcemaps:upload

            - name: Remove sourcemaps before Pages upload
              # `sourcemap: 'hidden'` only strips the sourceMappingURL comment —
              # the .map files would otherwise ship publicly with the bundle
              # (~392k LOC of sources). Uploaded to Sentry/Datadog above when
              # configured; never publish to Pages.
              # CI-C-2: `rm dist/**/*.map` does NOT recurse without
              # `shopt -s globstar` (`**` degrades to `*`), so nested maps
              # (dist/assets/chunks/*.map) would leak. `find` is exact.
              run: find dist -name '*.map' -delete

            - name: Publish wiki site under /wiki/
              # Builds a self-contained HTML wiki (nav + client search +
              # mermaid) from the committed markdown mirror in docs/wiki and
              # serves it alongside the app at /wiki/. Stdlib-only Node.
              run: |
                  node scripts/gen-wiki-site.mjs
                  mkdir -p dist/wiki
                  cp -r wiki-site/. dist/wiki/

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: dist/

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
