# ─── HTTPS (production) ────────────────────────────────────────
# Built with:  docker build --build-arg NGINX_CONFIG=nginx-ssl.conf
#
# TLS certs are NOT baked into the image.  Mount them at deploy
# time, e.g.:
#   volumes:
#     - ./certs/fullchain.pem:/etc/nginx/ssl/cert.pem:ro
#     - ./certs/privkey.pem:/etc/nginx/ssl/key.pem:ro
# Or use a certbot sidecar and share its /etc/letsencrypt volume.
# ───────────────────────────────────────────────────────────────

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;

# Redirect HTTP→HTTPS on the unprivileged :8080 (mapped to host :80
# by docker-compose in the prod profile).  Removed in dev profile.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.openrouter.ai https://*.openai.com https://*.anthropic.com https://generativelanguage.googleapis.com https://*.cloudflare.com https://*.cerebras.ai https://*.groq.com https://*.nvidia.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # SEC-06: unsafe-eval intentionally OMITTED from production CSP.
        # The sandbox worker (sandbox.worker.ts) uses new Function() for
        # AST-validated code execution — this is a deliberate design choice
        # with meriyah AST parsing as the primary security boundary.
        # wasm-unsafe-eval is required by ONNX Runtime Web (ort-wasm-simd-threaded).
        # If sandbox worker fails due to CSP, see trusted-types or worker-blob CSP.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.openrouter.ai https://*.openai.com https://*.anthropic.com https://generativelanguage.googleapis.com https://*.cloudflare.com https://*.cerebras.ai https://*.groq.com https://*.nvidia.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
        access_log off;
    }

    # ── LLM provider proxy routes ────────────────────────────────────
    # BLD-02: All /proxy/* paths must be proxied in production Docker.
    # ─────────────────────────────────────────────────────────────────

    location /proxy/gemini/ {
        proxy_pass ${PROXY_GEMINI}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/openrouter/ {
        proxy_pass ${PROXY_OPENROUTER}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/nvidia/ {
        proxy_pass ${PROXY_NVIDIA}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/groq/ {
        proxy_pass ${PROXY_GROQ}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/cerebras/ {
        proxy_pass ${PROXY_CEREBRAS}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/cloudflare/ {
        proxy_pass ${PROXY_CLOUDFLARE}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # C-101: Accept no-slash form and redirect to canonical trailing-slash URL
    location = /proxy/fetch { return 308 /proxy/fetch/; }

    # Tool execution proxy (fetch)
    location /proxy/fetch/ {
        proxy_pass ${PROXY_FETCH}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # C-100: OpenAI proxy (used by key-diagnostics.ts for billing/credit_grants)
    location /proxy/openai/ {
        proxy_pass ${PROXY_OPENAI}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/ {
        deny all;
        return 403;
    }

    # BLD-07: Streaming proxy settings for /api/ (matches nginx.conf provider blocks)
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
