# ─── HTTP-only (development) ───────────────────────────────────
# Used by default (Dockerfile's NGINX_CONFIG arg).  Listens on
# 8080 inside the container; docker-compose maps it to localhost:80.
# WARNING: This is HTTP only — API keys sent through /proxy/* are
# transmitted in the clear. For production, use:
#   docker build --build-arg NGINX_CONFIG=nginx-ssl.conf
# and mount a /etc/nginx/ssl volume via docker-compose.
# ───────────────────────────────────────────────────────────────

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (no HSTS over plain HTTP — would be ignored)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SEC-06: unsafe-eval intentionally OMITTED from production CSP.
    # The sandbox worker (sandbox.worker.ts) uses new Function() for
    # AST-validated code execution — this is a deliberate design choice
    # with meriyah AST parsing as the primary security boundary.
    # wasm-unsafe-eval is required by ONNX Runtime Web (ort-wasm-simd-threaded).
    # If sandbox worker fails due to CSP, see trusted-types or worker-blob CSP.
    # SEC-06: wss: intentionally omitted — unrestricted WebSocket is a data exfiltration channel.
    # If sync-server is needed, add wss://YOUR_SYNC_SERVER_ORIGIN explicitly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.openrouter.ai https://*.openai.com https://*.anthropic.com https://generativelanguage.googleapis.com https://*.cloudflare.com https://*.cerebras.ai https://*.groq.com https://*.nvidia.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;

    # SPA fallback — every unknown path returns index.html so the
    # client-side router can pick it up.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache static assets
    # BLD-09: Must repeat ALL server-level security headers here because nginx
    # add_header in a location block overrides (not merges) the parent.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # SEC-06: See server block for CSP rationale. unsafe-eval intentionally omitted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.openrouter.ai https://*.openai.com https://*.anthropic.com https://generativelanguage.googleapis.com https://*.cloudflare.com https://*.cerebras.ai https://*.groq.com https://*.nvidia.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
        access_log off;
    }

    # ── LLM provider proxy routes ────────────────────────────────────
    # BLD-02: All /proxy/* paths must be proxied in production Docker.
    #         Dev uses Vite proxy; prod uses nginx. Defaults match Vite.
    # ─────────────────────────────────────────────────────────────────
    # Shared proxy settings for LLM streaming
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Gemini
    location /proxy/gemini/ {
        proxy_pass ${PROXY_GEMINI}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OpenRouter
    location /proxy/openrouter/ {
        proxy_pass ${PROXY_OPENROUTER}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # NVIDIA NIM
    location /proxy/nvidia/ {
        proxy_pass ${PROXY_NVIDIA}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Groq
    location /proxy/groq/ {
        proxy_pass ${PROXY_GROQ}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cerebras
    location /proxy/cerebras/ {
        proxy_pass ${PROXY_CEREBRAS}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cloudflare AI Gateway
    location /proxy/cloudflare/ {
        proxy_pass ${PROXY_CLOUDFLARE}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # C-101: Accept no-slash form and redirect to canonical trailing-slash URL
    location = /proxy/fetch { return 308 /proxy/fetch/; }

    # Tool execution proxy (fetch)
    location /proxy/fetch/ {
        proxy_pass ${PROXY_FETCH}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # C-100: OpenAI proxy (used by key-diagnostics.ts for billing/credit_grants)
    location /proxy/openai/ {
        proxy_pass ${PROXY_OPENAI}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Generic catch-all /proxy/* for future providers ─────────────
    # RC-06: Deny by default — only known providers are proxied above.
    # To add a new provider, add an explicit location block above.
    location /proxy/ {
        deny all;
        return 403;
    }

    # API proxy — routes to whatever the host resolves.  Override at
    # deploy time with -e API_UPSTREAM=... if needed.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
